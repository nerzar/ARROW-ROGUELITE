<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOL-001 Creature Pose Editor</title>
<link rel="stylesheet" href="./calibration-editor.css">
<link rel="stylesheet" href="./pose-editor.css">
</head>
<body>
<div class="editor-shell">
  <header class="topbar">
    <strong>TOOL-001</strong> Creature Pose Editor
    <label>Creature <select id="speciesPick"></select></label>
    <button id="saveBtn" class="primary-btn" title="Copy the assigned frames into the project and save the pose manifest">💾 Save</button>
    <span id="saveBadge" class="save-badge">Ready</span>
    <span class="grow"></span>
    <a href="./calibration-editor.html" style="color:inherit; font-weight:600; text-decoration:none; margin-left:6px" title="Back to Campaign Editor">← Campaign Editor</a>
    <a href="./index.html" style="color:inherit; font-weight:600; text-decoration:none; margin-left:6px" title="Back to playable game">← Playable game</a>
  </header>
  <div id="statusLine" class="import-status"></div>

  <div class="body">
    <div class="stage-col">
      <div class="stage" id="stage">
        <div class="bg-layer" id="bgLayer"></div>
        <div class="fp-box" id="fpBox" title="Runtime character footprint (representative size; all offsets are footprint fractions, so they transfer 1:1)"></div>
        <div class="ground-line" id="groundLine" title="Footprint bottom = where visible feet land at zero offsets"></div>
        <div class="hud-mock-bar" id="hudBarMock" title="HP bar mock — moves with HUD offset"></div>
        <div class="hud-mock-plate" id="hudPlateMock" title="HUD plate mock (name / HP / ATTACK IN) — moves with HUD offset"><span>HUD</span></div>
        <div class="shadow-mock" id="shadowMock" title="Shadow mock — moves with shadow offset only"></div>
        <img id="previewImg" class="preview-img" alt="">
        <div class="handles-layer" id="handlesLayer">
          <div class="handle actor" id="pivotHandle" tabindex="0" title="Foot pivot — drag or use arrow keys">●</div>
        </div>
      </div>
      <section class="pose-slot-section">
        <div id="poseSlotList" class="pose-slot-strip"></div>
      </section>
    </div>

    <aside class="side-panel">
      <section>
        <h3>Current values</h3>
        <table class="values-table" id="valuesTable">
          <tr><th>Field</th><th>Value</th></tr>
          <tr><td>Species id</td><td id="valSpeciesId">—</td></tr>
          <tr><td>Active pose</td><td id="valActivePose">—</td></tr>
          <tr><td>Pivot X (frac)</td><td id="valPivotX">—</td></tr>
          <tr><td>Pivot Y (frac)</td><td id="valPivotY">—</td></tr>
          <tr><td>Scale</td><td id="valScale">—</td></tr>
          <tr><td>HUD X (frac)</td><td id="valHudX">—</td></tr>
          <tr><td>HUD Y (frac)</td><td id="valHudY">—</td></tr>
          <tr><td>HUD size</td><td id="valHudSize">—</td></tr>
          <tr><td>Shadow X (frac)</td><td id="valShX">—</td></tr>
          <tr><td>Shadow Y (frac)</td><td id="valShY">—</td></tr>
          <tr><td>Poses assigned</td><td id="valAssignedCount">—</td></tr>
        </table>
      </section>

      <section>
        <div class="adjust-head"><h3>Adjust</h3><button id="resetBtn" class="reset-btn" title="Reset pivot/scale/HUD/shadow to defaults (applies on Save)">Reset</button></div>
        <div class="scale-controls">
          <div class="scale-row">
            <label>Scale</label>
            <input type="range" id="scaleRange" min="0.4" max="2" step="0.01" value="1">
            <input type="number" id="scaleNum" min="0.4" max="2" step="0.01" value="1">
          </div>
          <div class="scale-row">
            <label>HUD X</label>
            <input type="range" id="hudXRange" min="-1" max="1" step="0.005" value="0">
            <input type="number" id="hudXNum" step="0.005" value="0">
          </div>
          <div class="scale-row">
            <label>HUD Y</label>
            <input type="range" id="hudYRange" min="-1" max="1" step="0.005" value="0">
            <input type="number" id="hudYNum" step="0.005" value="0">
          </div>
          <div class="scale-row">
            <label>HUD size</label>
            <input type="range" id="hudSizeRange" min="0.5" max="2" step="0.01" value="1">
            <input type="number" id="hudSizeNum" min="0.5" max="2" step="0.01" value="1">
          </div>
          <div class="scale-row">
            <label>Shadow X</label>
            <input type="range" id="shXRange" min="-1" max="1" step="0.005" value="0">
            <input type="number" id="shXNum" step="0.005" value="0">
          </div>
          <div class="scale-row">
            <label>Shadow Y</label>
            <input type="range" id="shYRange" min="-1" max="1" step="0.005" value="0">
            <input type="number" id="shYNum" step="0.005" value="0">
          </div>
        </div>
      </section>

      <section>
        <h3>Source frames</h3>
        <p class="small muted" id="sourceFolderHint"></p>
        <div id="sourceGallery" class="source-gallery"></div>
      </section>
    </aside>
  </div>
</div>
<script type="module" src="./pose-editor.js"></script>
</body>
</html>
